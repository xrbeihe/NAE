name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-asyncio aiosqlite

      - name: Run tests
        working-directory: backend
        run: |
          mkdir -p ../data
          python -m pytest ../tests/ -v --tb=short 2>&1 | tail -30

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    steps:
      # ── 部署保护 ─────────────────────────────────────────────
      # 网页编辑器（designer 等）会把内容直接写到服务器磁盘的包文件
      # （world_facts.json / system_prompt.txt / ui.json …），而下面的
      # actions/checkout 会把已跟踪文件重置为仓库版本——手改内容会被
      # 静默覆盖且无法找回。因此在 checkout 之前检测 worktree 是否有
      # 未提交改动：有则先打包备份为 artifact，再中止部署。
      - name: Detect server-side uncommitted edits (pre-checkout)
        id: dirty
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ ! -d .git ]; then
            echo "dirty=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$(git status --porcelain 2>/dev/null)" ]; then
            echo "dirty=yes" >> "$GITHUB_OUTPUT"
            echo "Server worktree has uncommitted changes:"
            git status --porcelain
          else
            echo "dirty=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Backup server-side edits (pre-checkout)
        if: steps.dirty.outputs.dirty == 'yes'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ane-server-backup"
          cd "$GITHUB_WORKSPACE"
          # 完整打包网页可编辑的世界观内容（当前磁盘状态，含未提交手改）
          tar -czf "$RUNNER_TEMP/ane-server-backup/server-worldviews.tar.gz" backend/ane/worldviews 2>/dev/null || true
          # 已跟踪文件的未提交 diff（覆盖所有被网页编辑器修改的文件）
          git diff > "$RUNNER_TEMP/ane-server-backup/server-uncommitted.diff" 2>/dev/null || true
          # 未提交文件清单
          git status --porcelain > "$RUNNER_TEMP/ane-server-backup/server-status.txt" 2>/dev/null || true
          ls -la "$RUNNER_TEMP/ane-server-backup"

      - name: Upload server-edit backup artifact
        if: steps.dirty.outputs.dirty == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: ane-server-edits-backup
          path: ${{ runner.temp }}/ane-server-backup
          if-no-files-found: warn

      - name: Abort deploy to protect server-side edits
        if: steps.dirty.outputs.dirty == 'yes'
        shell: bash
        run: |
          echo "::error::检测到服务器端存在未提交修改（通常是网页编辑保存的世界观设定，如 world_facts.json）。"
          echo "::error::已备份到 Actions artifact「ane-server-edits-backup」，请下载找回内容。"
          echo "::error::处理方式：确认内容后 git add + commit + push 同步；或在服务器 git checkout -- . 丢弃后重新推送。"
          exit 1

      - uses: actions/checkout@v5.1.0
        with:
          clean: false

      - name: Write .env from secrets
        run: |
          echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" | sudo tee /etc/ane/.env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" | sudo tee -a /etc/ane/.env
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" | sudo tee -a /etc/ane/.env
          # 管理员白名单：secret 配置后写入（覆盖 config.json 默认）；未配置则用默认值
          if [ -n "${{ secrets.ANE_WORLDVIEW_ADMIN_IDS }}" ]; then
            echo "ANE_WORLDVIEW_ADMIN_IDS=${{ secrets.ANE_WORLDVIEW_ADMIN_IDS }}" | sudo tee -a /etc/ane/.env
          fi
          sudo chmod 600 /etc/ane/.env
      - name: Ensure venv + install/update dependencies
        run: |
          if [ ! -x .venv/bin/pip ]; then
            echo "Creating venv..."
            python3 -m venv .venv
          fi
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pytest-asyncio aiosqlite
        shell: bash
      - name: Ensure systemd uses /etc/ane/.env
        run: |
          if ! grep -q 'EnvironmentFile=/etc/ane/.env' /etc/systemd/system/ane.service; then
            sudo sed -i '/^\[Service\]/a EnvironmentFile=/etc/ane/.env' /etc/systemd/system/ane.service
            sudo systemctl daemon-reload
          fi
        shell: bash
      - name: Point systemd at the workflow venv
        run: |
          # The workflow installs deps into <checkout>/.venv; make sure the
          # systemd service uses that same venv (self-heals an old path).
          TARGET="/home/runner/actions-runner/_work/NAE/NAE/.venv/bin/python"
          if ! grep -q "ExecStart=${TARGET}" /etc/systemd/system/ane.service; then
            echo "Fixing ExecStart to $TARGET"
            sudo sed -i "s|ExecStart=.*|ExecStart=${TARGET} -m ane.main|" /etc/systemd/system/ane.service
            sudo systemctl daemon-reload
          else
            echo "ExecStart already points to workflow venv"
          fi
          grep -E '^(ExecStart|WorkingDirectory|EnvironmentFile)' /etc/systemd/system/ane.service
        shell: bash
      - name: Restart ANE service
        run: |
          sudo systemctl restart ane.service || true
          # Poll the health endpoint — systemctl active doesn't mean the port is up.
          # Startup includes DB migration + worldview pack loading (can take ~30s).
          ok=0
          for i in $(seq 1 45); do
            if curl -sf http://localhost:8002/api/health >/dev/null 2>&1; then
              echo "ANE health OK after ~${i}s"
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "::error::ANE health check failed (8002 not serving)"
            systemctl is-active ane.service || true
            sudo journalctl -u ane.service -n 60 --no-pager || true
            exit 1
          fi
        shell: bash

      - name: Verify
        run: |
          # Final confirmation with retries
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8002/api/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          curl -sf http://localhost:8002/api/health

