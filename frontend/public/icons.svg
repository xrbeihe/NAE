<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!--
    ANE 图标集 v1 —— 离线 sprite，页面用法：
      <svg class="icon" aria-hidden="true"><use href="/public/icons.svg#i-world"></use></svg>
